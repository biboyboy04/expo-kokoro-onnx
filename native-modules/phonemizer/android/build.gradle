apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
  namespace "com.allysonai.ttsdemo.phonemizer"
  compileSdkVersion rootProject.hasProperty("android.compileSdkVersion") ? rootProject.ext.get("android.compileSdkVersion") : 35

  defaultConfig {
    minSdkVersion rootProject.hasProperty("android.minSdkVersion") ? rootProject.ext.get("android.minSdkVersion") : 23
    targetSdkVersion rootProject.hasProperty("android.targetSdkVersion") ? rootProject.ext.get("android.targetSdkVersion") : 35
    consumerProguardFiles "consumer-rules.pro"
  }

  sourceSets {
    main {
      java.srcDirs = ["src/main/kotlin"]
      res.srcDirs = ["src/main/res"]
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  kotlinOptions {
    jvmTarget = "11"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "com.facebook.react:react-native:+"
  implementation "com.facebook.react:react-android:+"
  implementation "expo:expo-modules-core"
}
